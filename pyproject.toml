[project]
name = "evidence-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "imunick", email = "nick@imunotx.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.161.1",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "mypy>=2.4.0",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["faiss", "sentence_transformers", "sentence_transformers.*", "pyarrow", "pyarrow.*", "rank_bm25"]
ignore_missing_imports = true

[project.optional-dependencies]
# PyTorch variant: CUDA build from PyPI locally, CPU-only build in the API container.
cpu = ["torch"]
gpu = ["torch"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true