services:
  ollama:
    image: ollama/ollama:0.40.6
    environment:
      # Disable llama.cpp's prompt cache: it only helps repeated prompts and
      # exhausts memory during long runs (see docs/REPORT.md, section 12).
      LLAMA_ARG_CACHE_RAM: "0"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      EVIDENCERAG_LLM_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      start_period: 60s

volumes:
  ollama-models: